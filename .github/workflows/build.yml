name: LeasingNinja in Object Pascal – CI

on: [ push, pull_request ]

jobs:
  build:

    runs-on: ubuntu-26.04

    steps:
    - name: Checkout source code
      uses: actions/checkout@v7

    - name: Set up Free Pascal and Lazarus
      uses: gcarreno/setup-lazarus@v3
      with:
        lazarus-version: "4.4"
        with-cache: false

    - name: Build
      run: |
        mkdir -p lib bin
        fpc -FUlib -FEbin -Fusrc -Futests tests/LeasingNinjaTests.lpr

    - name: Test
      run: bin/LeasingNinjaTests --all --format=plain
